<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14161C">
<title>miniGames</title>
<meta property="og:title" content="miniGames">
<meta property="og:description" content="Te han invitado a miniGames · You've been invited to miniGames">
<meta property="og:image" content="https://po2032.github.io/sala/icono.png">
<link rel="icon" href="icono.png">
<style>
  :root {
    --background: #14161C;
    --surface: #1F232D;
    --text: #F2F3F5;
    --text-muted: #A5ABB8;
    --accent: #F2B84B;
    --on-accent: #14161C;
    --warning: #E5645A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--background);
    color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 24px;
    line-height: 1.25;
  }
  .card {
    padding: 24px 20px;
    border-radius: 28px;
    background: var(--surface);
  }
  .label {
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
  }
  .code {
    margin: 4px 0 24px;
    font: 700 44px/1.1 ui-monospace, "Roboto Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  /* Los códigos de Besties («Ana_María#4821») son más largos que los de sala. */
  .code--long {
    font-size: 30px;
    letter-spacing: 0.02em;
    overflow-wrap: anywhere;
  }
  .button {
    display: block;
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .button--main {
    background: var(--accent);
    color: var(--on-accent);
  }
  .button--second {
    margin-top: 12px;
    background: transparent;
    color: var(--text);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18);
  }
  .help {
    margin: 24px 4px 0;
    color: var(--text-muted);
    font-size: 15px;
  }
  .help p { margin: 0 0 10px; }
  .missing {
    margin: 0 0 20px;
    padding: 12px 16px;
    border-radius: 16px;
    background: rgba(229, 100, 90, 0.16);
    color: var(--text);
    font-size: 15px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icono.png" alt="">
  <h1 id="title"></h1>

  <section class="card" id="room" hidden>
    <p class="missing" id="no-app" hidden></p>
    <p class="label" id="code-label"></p>
    <p class="code" id="code"></p>
    <a class="button button--main" id="open"></a>
    <button class="button button--second" id="copy" type="button"></button>
  </section>

  <div class="help" id="help"></div>
</main>

<script>
(function () {
  var texts = {
    es: {
      title: "Te han invitado a jugar",
      titleBad: "Este enlace no lleva a ninguna sala",
      codeLabel: "Código de la sala",
      open: "Abrir en miniGames",
      copy: "Copiar código",
      copied: "¡Copiado!",
      noApp: "No hemos encontrado miniGames en este móvil.",
      help: [
        "Si no se abre, entra en miniGames, toca «Entrar con código» y escribe el código.",
        "¿Aún no tienes miniGames? Pídesela a quien te ha invitado."
      ],
      helpBad: [
        "Pide a quien te ha invitado que vuelva a enviarte el enlace, o el código de la sala para «Entrar con código»."
      ],
      bestieTitle: "Añade a {0} como Bestie",
      bestieTitleBad: "Este enlace no trae ningún código de Besties",
      bestieLabel: "Su código de Besties",
      bestieHelp: [
        "Si no se abre, entra en miniGames, toca «Besties», escribe el código y toca «Añadir».",
        "¿Aún no tienes miniGames? Pídesela a quien te ha mandado el enlace."
      ],
      bestieHelpBad: [
        "Pide a quien te lo ha mandado que vuelva a enviarte el enlace, o su código para añadirlo en «Besties»."
      ]
    },
    en: {
      title: "You've been invited to play",
      titleBad: "This link doesn't lead to a room",
      codeLabel: "Room code",
      open: "Open in miniGames",
      copy: "Copy code",
      copied: "Copied!",
      noApp: "We couldn't find miniGames on this phone.",
      help: [
        "If it doesn't open, go into miniGames, tap “Join with code” and type the code.",
        "Don't have miniGames yet? Ask whoever invited you."
      ],
      helpBad: [
        "Ask whoever invited you to send the link again, or the room code for “Join with code”."
      ],
      bestieTitle: "Add {0} as a Bestie",
      bestieTitleBad: "This link doesn't have a Besties code",
      bestieLabel: "Their Besties code",
      bestieHelp: [
        "If it doesn't open, go into miniGames, tap “Besties”, type the code and tap “Add”.",
        "Don't have miniGames yet? Ask whoever sent you the link."
      ],
      bestieHelpBad: [
        "Ask whoever sent it to you to send the link again, or their code to add them in “Besties”."
      ]
    }
  };

  // El identificador de la app en Android: tiene que ser el mismo que en .well-known/assetlinks.json.
  var androidPackage = "com.DefaultCompany.miniGames";

  var language = (navigator.language || "es").toLowerCase().indexOf("es") === 0 ? "es" : "en";
  var t = texts[language];
  document.documentElement.lang = language;

  // «?c=CODIGO» invita a una sala; «?b=Nombre#1234», a ser Besties. Los dos abren la app con minigames://sala/.
  var params = new URLSearchParams(location.search);
  var bestie = params.has("b");
  var code;
  var valid;

  if (bestie) {
    // Como BestieCode.TryNormalize en la app: un nombre sin espacios, «#» y números.
    code = (params.get("b") || "").trim();
    var hash = code.lastIndexOf("#");
    valid = hash > 0 && /^\d+$/.test(code.substring(hash + 1)) && !/\s/.test(code);
  } else {
    code = (params.get("c") || "").trim().toUpperCase();
    valid = /^[A-Z0-9]{6}$/.test(code);
  }

  function byId(id) { return document.getElementById(id); }

  function fillHelp(lines) {
    var help = byId("help");
    lines.forEach(function (line) {
      var p = document.createElement("p");
      p.textContent = line;
      help.appendChild(p);
    });
  }

  if (!valid) {
    byId("title").textContent = bestie ? t.bestieTitleBad : t.titleBad;
    fillHelp(bestie ? t.bestieHelpBad : t.helpBad);
    return;
  }

  if (bestie) {
    // El nombre sin número y con espacios, como BestieCode.DisplayName: «Ana_María#4821» → «Ana María».
    var name = code.substring(0, code.lastIndexOf("#")).replace(/_/g, " ");
    byId("title").textContent = t.bestieTitle.replace("{0}", name);
    byId("code-label").textContent = t.bestieLabel;
    byId("code").classList.add("code--long");
    fillHelp(t.bestieHelp);
  } else {
    byId("title").textContent = t.title;
    byId("code-label").textContent = t.codeLabel;
    fillHelp(t.help);
  }

  byId("code").textContent = code;
  byId("room").hidden = false;

  if (params.get("app") === "0") {
    byId("no-app").textContent = t.noApp;
    byId("no-app").hidden = false;
  }

  // Lo que va detrás de minigames://sala/: el código de la sala, o «?b=» con el de Besties.
  var target = bestie ? "?b=" + encodeURIComponent(code) : code;

  // En Android, Chrome abre la app con un intent; si no está instalada, vuelve a esta página con app=0.
  var appLink = "minigames://sala/" + target;

  if (/android/i.test(navigator.userAgent)) {
    var back = location.origin + location.pathname + (bestie ? target : "?c=" + code) + "&app=0";
    appLink = "intent://sala/" + target + "#Intent;scheme=minigames;package=" + androidPackage
      + ";S.browser_fallback_url=" + encodeURIComponent(back) + ";end";
  }

  var open = byId("open");
  open.textContent = t.open;
  open.href = appLink;

  var copy = byId("copy");
  copy.textContent = t.copy;
  copy.addEventListener("click", function () {
    function done() {
      copy.textContent = t.copied;
      setTimeout(function () { copy.textContent = t.copy; }, 2000);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(done, copyOld);
    } else {
      copyOld();
    }

    function copyOld() {
      var field = document.createElement("textarea");
      field.value = code;
      field.style.position = "fixed";
      field.style.opacity = "0";
      document.body.appendChild(field);
      field.select();
      try { if (document.execCommand("copy")) { done(); } } catch (e) {}
      document.body.removeChild(field);
    }
  });
})();
</script>
</body>
</html>
